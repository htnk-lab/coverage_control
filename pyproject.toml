[tool.isort]
profile = "black"
src_paths = ["coverage_control"]
line_length = 119
# ignore files in .gitignore
skip_gitignore = true

[tool.black]
line-length = 119
target-version = ['py312']
include = '\.pyi?$'
# automatically ignore files in .gitignore
exclude = '''
(
    \.git
    | \.vscode
    | assets
    | config
    | launch
    | rviz
)
'''

[tool.ruff]
line-length = 119
# automatically ignore files in .gitignore
exclude = [
    ".git",
    ".vscode",
    "assets",
    "config",
    "launch",
    "rviz",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E722", "F841"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
disallow_any_generics = false

[tool.taskipy.tasks]
fmt = "isort . && black ."
lint = "black --check . && ruff check ."
mypy = "mypy ."
